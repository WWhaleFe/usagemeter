[package]
name = "um-platform"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "UsageMeter OS별 코드: 테두리 띠 창, 디스플레이, 마우스, 자동 실행"

[dependencies]
thiserror.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2.workspace = true
objc2-foundation = { workspace = true, features = ["NSDictionary", "NSValue", "NSString", "NSArray", "NSGeometry"] }
objc2-app-kit = { workspace = true, features = ["NSApplication", "NSWindow", "NSView", "NSScreen", "NSColor", "NSGraphics", "NSResponder", "NSPanel", "NSVisualEffectView", "NSEvent", "NSAppearance", "block2", "objc2-quartz-core"] }
block2 = "0.6.2"
objc2-quartz-core = { workspace = true, features = ["CALayer"] }
objc2-core-graphics = { workspace = true, features = ["CGImage", "CGColorSpace", "CGDataProvider", "CGDirectDisplay", "CGDisplayConfiguration"] }
objc2-core-foundation = { version = "0.3.2", features = ["CFData", "CFString", "CFUUID"] }

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_LibraryLoader",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_HiDpi",
  "Win32_System_Registry",
] }
