<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>UsageMeter</title>
<style>
  :root { color-scheme: light dark; --bg: #f5f5f7; --fg: #1d1d1f; --muted: #6e6e73; }
  @media (prefers-color-scheme: dark) { :root { --bg: #1e1e20; --fg: #f2f2f4; --muted: #9a9aa0; } }
  body { margin: 0; font: 14px -apple-system, "Segoe UI Variable Text", "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; background: var(--bg); color: var(--fg); }
  main { padding: 32px; max-width: 560px; }
  h1 { font-size: 20px; margin: 0 0 8px; }
  p { color: var(--muted); line-height: 1.5; margin: 0; }
</style>
<main>
  <h1 id="t">설정</h1>
  <p>이 화면은 Rust 이식 5·6단계에서 만들어집니다. 지금은 메뉴의 대부분 기능(표시 정보, 갱신 주기, 언어, 프리셋, 업데이트)을 메뉴에서 바로 쓸 수 있습니다.</p>
</main>
<script>
  const names = { settings: '설정', analytics: '사용량 분석', support: '후원' };
  const show = () => { const k = location.hash.slice(1).split('/'); document.getElementById('t').textContent = names[k[1] === 'support' ? 'support' : k[0]] || '설정'; };
  addEventListener('hashchange', show); show();
</script>
</html>
