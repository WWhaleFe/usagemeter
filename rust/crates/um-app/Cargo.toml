[package]
name = "um-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "UsageMeter 앱(Tauri): 트레이, 테두리, 수집, 창"

[[bin]]
name = "usagemeter"
path = "src/main.rs"

[build-dependencies]
tauri-build.workspace = true

[dependencies]
um-core.workspace = true
um-providers.workspace = true
um-render.workspace = true
tiny-skia.workspace = true
um-platform.workspace = true
tauri.workspace = true
serde_json.workspace = true
chrono.workspace = true
directories.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
reqwest.workspace = true
arboard.workspace = true
open.workspace = true

[features]
# Microsoft Store판: 앱 내 업데이트·레지스트리 자동 실행 제외(계획서 11-1). 아직 해당 기능 없음.
store = []

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { workspace = true }
objc2-foundation = { workspace = true, features = ["NSURLRequest", "NSURL", "NSString"] }
objc2-web-kit = { workspace = true, features = ["WKWebView", "WKNavigation"] }
