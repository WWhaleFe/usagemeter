[package]
name = "um-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "UsageMeter 앱(Tauri): 트레이, 테두리, 수집, 창"

[[bin]]
name = "usagemeter"
path = "src/main.rs"

[build-dependencies]
tauri-build.workspace = true

[dependencies]
um-core.workspace = true
um-providers.workspace = true
um-render.workspace = true
tiny-skia.workspace = true
um-platform.workspace = true
um-locallogs.workspace = true
tauri.workspace = true
tauri-plugin-autostart.workspace = true
tauri-plugin-single-instance.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
directories.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
reqwest.workspace = true
arboard.workspace = true
rfd.workspace = true
open.workspace = true
qrcode.workspace = true
notify.workspace = true

[features]
# 정식판: Swift 버전과 같은 데이터 폴더를 쓰되 Rust 파일만 저장한다.
production = []
# Microsoft Store판: 앱 내 업데이트·레지스트리 자동 실행 제외(계획서 11-1). 아직 해당 기능 없음.
store = []

[target.'cfg(target_os = "macos")'.dependencies]
plist.workspace = true
block2 = "0.6.2"
objc2-user-notifications = "0.3.2"
objc2 = { workspace = true }
objc2-app-kit = { workspace = true, features = ["NSColorPanel", "NSColor", "NSColorSpace"] }
objc2-foundation = { workspace = true, features = ["NSURLRequest", "NSURL", "NSString"] }
objc2-web-kit = { workspace = true, features = ["WKWebView", "WKNavigation"] }
