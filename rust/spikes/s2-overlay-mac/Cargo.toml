[package]
name = "s2-overlay-mac"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
tiny-skia = "0.12.0"
kurbo = "0.13.1"
objc2 = "0.6.5"
objc2-foundation = "0.3.2"
objc2-app-kit = { version = "0.3.2", features = ["NSApplication", "NSWindow", "NSView", "NSScreen", "NSColor", "NSGraphics", "NSRunningApplication", "NSResponder", "objc2-quartz-core"] }
objc2-quartz-core = { version = "0.3.2", features = ["CALayer"] }
objc2-core-graphics = { version = "0.3.2", features = ["CGImage", "CGColorSpace", "CGDataProvider"] }
objc2-core-foundation = { version = "0.3.2", features = ["CFData"] }

[profile.release]
opt-level = "s"
lto = "thin"
strip = true
