# UsageMeter Rust 워크스페이스 (macOS + Windows). 계획: ../docs/RUST_PORT_PLAN.md
[workspace]
resolver = "3"
members = ["crates/*"]
# 0단계 스파이크는 각자 독립 패키지(공유 target은 CARGO_TARGET_DIR로)
exclude = ["spikes"]

[workspace.package]
version = "2.1.2"
edition = "2024"
license = "MIT"
repository = "https://github.com/WWhaleFe/usagemeter"
rust-version = "1.90"

[workspace.dependencies]
um-core = { path = "crates/um-core" }
um-providers = { path = "crates/um-providers" }
um-locallogs = { path = "crates/um-locallogs" }
um-render = { path = "crates/um-render" }
um-platform = { path = "crates/um-platform" }

serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
rusqlite = { version = "0.43.0", features = ["bundled"] }
plist = "1.10.3"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std", "serde"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt", "macros", "time", "sync", "process", "fs"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "cookies", "rustls", "blocking"] }
notify = "8.2.2"
directories = "6.0.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std", "ansi"] }
tiny-skia = "0.12.0"
kurbo = "0.13.1"
cosmic-text = "0.19.0"
qrcode = "0.14.1"
open = "5.4.5"
arboard = "3.7.0"
rfd = { version = "0.15.4", default-features = false }

tauri = { version = "2.12.5", features = ["tray-icon"] }
tauri-build = "2.7.4"
tauri-plugin-single-instance = "2.5.5"
tauri-plugin-autostart = "2.7.0"
tauri-plugin-notification = "2.8.1"
tauri-plugin-updater = "2.14.1"

objc2 = "0.6.5"
objc2-foundation = "0.3.2"
objc2-app-kit = "0.3.2"
objc2-quartz-core = "0.3.2"
objc2-core-graphics = "0.3.2"
objc2-web-kit = "0.3.2"
windows = "0.62.2"
webview2-com = "0.39.1"

# 메모리·크기 우선 릴리스 빌드(계획서 4-3 ⑥).
[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true

# 테두리 기준 이미지 비교 테스트가 디버그에서 느리다(kurbo 호 길이 계산). 기하 크레이트만 최적화.
[profile.dev.package.kurbo]
opt-level = 3
[profile.dev.package.tiny-skia]
opt-level = 3
