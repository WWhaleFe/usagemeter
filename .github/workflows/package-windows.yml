# Windows 패키지(이 저장소 WWhaleFe/usagemeter-windows 전용). 이 저장소는 MS Store판이다: 설치 파일·포터블 zip도 store 기능으로 빌드해
# Store 앱과 같은 화면(업데이트·개발자에게 없음)을 미리 시험한다. 서명 없는 MSIX는 Store 제출용 산출물로만 남긴다.
# 태그 vX.Y.Z(-beta.N)를 push하면 공개 전 초안 릴리스에 설치 파일·포터블 zip을 붙인다. MSIX는 릴리스에 올리지 않는다.
name: package-windows

on:
  workflow_dispatch:
  push:
    # 시험용 빌드: rust-package 브랜치로 push하면 Actions 산출물만 만든다(릴리스 없음).
    branches: ["rust-package"]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  version:
    if: github.repository == 'WWhaleFe/usagemeter-windows'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      msix-version: ${{ steps.version.outputs.msix-version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - id: version
        name: Cargo 버전과 MSIX 네 자리 버전 읽기
        shell: python
        run: |
          import os
          import re
          import tomllib
          from pathlib import Path

          version = tomllib.loads(Path("rust/Cargo.toml").read_text())["workspace"]["package"]["version"]
          match = re.fullmatch(r"(\d+)\.(\d+)\.(\d+)(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?", version)
          if not match:
              raise ValueError(f"지원하지 않는 버전: {version}")
          parts = [int(part) for part in match.groups()]
          if parts[0] == 0 or any(part > 65535 for part in parts):
              raise ValueError(f"MSIX 버전 범위 초과: {version}")
          # Store 제출용 마지막 자리는 0. 사전 릴리스 접미사는 파일명에만 유지한다.
          msix_version = ".".join(map(str, [*parts, 0]))
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"version={version}\nmsix-version={msix_version}\n")

  windows:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, target: x86_64-pc-windows-msvc, arch: x64 }
          - { os: windows-11-arm, target: aarch64-pc-windows-msvc, arch: arm64 }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: pwsh
    env:
      PACKAGE_VERSION: ${{ needs.version.outputs.version }}
      MSIX_VERSION: ${{ needs.version.outputs.msix-version }}
      PACKAGE_ARCH: ${{ matrix.arch }}
      RUST_TARGET: ${{ matrix.target }}
      STORE_IDENTITY_NAME: ${{ vars.STORE_IDENTITY_NAME }}
      STORE_PUBLISHER: ${{ vars.STORE_PUBLISHER }}
      STORE_PUBLISHER_DISPLAY_NAME: ${{ vars.STORE_PUBLISHER_DISPLAY_NAME }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: rust/crates/um-app/ui-src/package-lock.json
      - name: UI 빌드
        working-directory: rust/crates/um-app/ui-src
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Cargo 버전을 Tauri 정식판 설정에 반영
        working-directory: rust/crates/um-app
        run: |
          $config = Get-Content tauri.release.conf.json -Raw | ConvertFrom-Json
          $config | Add-Member -NotePropertyName version -NotePropertyValue $env:PACKAGE_VERSION -Force
          $config | ConvertTo-Json -Depth 20 | Set-Content tauri.release.conf.json -Encoding utf8NoBOM
          New-Item -ItemType Directory -Force "$env:GITHUB_WORKSPACE/rust/dist" | Out-Null
      - name: NSIS 설치 파일 빌드
        working-directory: rust/crates/um-app
        run: |
          npx -y @tauri-apps/cli@2.12.4 build --target $env:RUST_TARGET --bundles nsis --features production,store --config tauri.release.conf.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $installers = @(Get-ChildItem "../../target/$env:RUST_TARGET/release/bundle/nsis/*.exe")
          if ($installers.Count -ne 1) { throw "NSIS 설치 파일이 정확히 하나여야 합니다." }
          Copy-Item $installers[0].FullName "../../dist/UsageMeter-$env:PACKAGE_VERSION-windows-$env:PACKAGE_ARCH-setup.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.arch }}-nsis
          path: rust/dist/*-setup.exe
          if-no-files-found: error
      - name: 직접 배포판 포터블 zip 생성
        run: |
          # Store 빌드가 실행 파일을 덮어쓰기 전에 직접 배포판을 보관한다.
          Compress-Archive -Path "rust/target/$env:RUST_TARGET/release/usagemeter.exe" -DestinationPath "rust/dist/UsageMeter-$env:PACKAGE_VERSION-windows-$env:PACKAGE_ARCH-portable.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.arch }}-portable
          path: rust/dist/*-portable.zip
          if-no-files-found: error
      - name: Store판 실행 파일 빌드
        working-directory: rust
        run: |
          $env:TAURI_CONFIG = Get-Content crates/um-app/tauri.release.conf.json -Raw
          # CLI 없이 빌드하므로 UI 포함에 필요한 custom-protocol도 명시한다.
          cargo build --release --target $env:RUST_TARGET -p um-app --features production,store,tauri/custom-protocol
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: 서명 없는 MSIX 생성
        run: |
          $sdkBin = "${env:ProgramFiles(x86)}/Windows Kits/10/bin"
          $makeappx = Get-ChildItem "$sdkBin/*/x64/makeappx.exe" |
            Sort-Object { [version]$_.Directory.Parent.Name } -Descending |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $makeappx) { throw "Windows SDK의 makeappx.exe를 찾을 수 없습니다." }
          $layout = "$env:RUNNER_TEMP/msix-$env:PACKAGE_ARCH"
          New-Item -ItemType Directory -Force "$layout/Assets" | Out-Null
          Copy-Item "rust/target/$env:RUST_TARGET/release/usagemeter.exe" "$layout/usagemeter.exe"
          Copy-Item rust/crates/um-app/icons/*.png "$layout/Assets/"
          $manifest = Get-Content rust/crates/um-app/packaging/msix/AppxManifest.xml -Raw
          $manifest = $manifest.Replace('__VERSION__', $env:MSIX_VERSION).Replace('__ARCH__', $env:PACKAGE_ARCH)
          # Partner Center → 제품 ID의 값(저장소 변수 STORE_*)이 있으면 Store 업로드용 신원으로 바꾼다.
          if ($env:STORE_IDENTITY_NAME) {
            $manifest = $manifest.Replace('Name="WWhaleFe.UsageMeter"', "Name=`"$env:STORE_IDENTITY_NAME`"")
            $manifest = $manifest.Replace('Publisher="CN=PLACEHOLDER-PARTNER-CENTER"', "Publisher=`"$env:STORE_PUBLISHER`"")
            $manifest = $manifest.Replace('<PublisherDisplayName>WWhaleFe</PublisherDisplayName>', "<PublisherDisplayName>$env:STORE_PUBLISHER_DISPLAY_NAME</PublisherDisplayName>")
          } else {
            Write-Warning "Store 신원 변수가 없어 시험용 신원으로 만듭니다(업로드 불가)."
          }
          $manifest | Set-Content "$layout/AppxManifest.xml" -Encoding utf8NoBOM
          # resources.pri: 매니페스트의 언어(ko·en·ja)와 이미지를 Windows·Store가 찾게 한다.
          $makepri = Join-Path (Split-Path $makeappx) "makepri.exe"
          $priconfig = "$env:RUNNER_TEMP/priconfig-$env:PACKAGE_ARCH.xml"
          & $makepri createconfig /cf $priconfig /dq ko-KR_en-US_ja-JP /pv 10.0.0 /o
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $makepri new /pr $layout /cf $priconfig /mn "$layout/AppxManifest.xml" /of "$layout/resources.pri" /o
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $makeappx pack /d $layout /p "rust/dist/UsageMeter-$env:PACKAGE_VERSION-$env:PACKAGE_ARCH.msix" /o
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.arch }}-msix
          path: rust/dist/*.msix
          if-no-files-found: error

  msixbundle:
    needs: [version, windows]
    runs-on: windows-latest
    env:
      PACKAGE_VERSION: ${{ needs.version.outputs.version }}
      MSIX_VERSION: ${{ needs.version.outputs.msix-version }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: windows-*-msix
          merge-multiple: true
          path: msix
      - name: 두 아키텍처를 서명 없는 Store 번들로 묶기
        shell: pwsh
        run: |
          $sdkBin = "${env:ProgramFiles(x86)}/Windows Kits/10/bin"
          $makeappx = Get-ChildItem "$sdkBin/*/x64/makeappx.exe" |
            Sort-Object { [version]$_.Directory.Parent.Name } -Descending |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $makeappx) { throw "Windows SDK의 makeappx.exe를 찾을 수 없습니다." }
          foreach ($arch in @('x64', 'arm64')) {
            if (-not (Test-Path "msix/UsageMeter-$env:PACKAGE_VERSION-$arch.msix")) {
              throw "필수 MSIX 없음: $arch"
            }
          }
          New-Item -ItemType Directory -Force dist | Out-Null
          & $makeappx bundle /d msix /p "dist/UsageMeter-$env:PACKAGE_VERSION.msixbundle" /bv $env:MSIX_VERSION /o
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-msixbundle
          path: dist/*.msixbundle
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [version, windows, msixbundle]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: windows-*
          merge-multiple: true
          path: dist
      - name: 공개 전 초안 릴리스에 설치 파일·포터블 zip 첨부(태그에 -가 있으면 시험판)
        uses: softprops/action-gh-release@v2
        with:
          name: UsageMeter for Windows ${{ needs.version.outputs.version }}
          draft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
          files: |
            dist/*-setup.exe
            dist/*-portable.zip
