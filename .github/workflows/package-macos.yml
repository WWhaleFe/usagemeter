# macOS 정식판·시험판 패키지(이 저장소 WWhaleFe/usagemeter 전용). Windows는 WWhaleFe/usagemeter-windows가 만든다.
# 태그 vX.Y.Z(-beta.N)를 push하면 공개 전 초안 릴리스에 UsageMeter-vX.Y.Z.zip을 붙인다. Homebrew 탭은 공개된 최신 릴리스를 따라간다.
name: package-macos

on:
  workflow_dispatch:
  push:
    # 시험용 빌드: rust-package 브랜치로 push하면 Actions 산출물만 만든다(릴리스 없음).
    branches: ["rust-package"]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  macos:
    if: github.repository == 'WWhaleFe/usagemeter'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: rust/crates/um-app/ui-src/package-lock.json
      - name: macOS 유니버설 zip 생성
        run: bash rust/tools/release-mac.sh
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: rust/dist/*.zip
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist
      - name: 공개 전 초안 릴리스에 맥 zip 첨부(태그에 -가 있으면 시험판)
        uses: softprops/action-gh-release@v2
        with:
          name: UsageMeter ${{ github.ref_name }}
          draft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
          files: dist/*.zip
